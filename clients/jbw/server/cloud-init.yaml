#cloud-config
write_files:
  - path: /opt/jbw/settings.env
    permissions: '0600'
    content: |
      # EDIT THESE THREE LINES before pasting (emails only, never passwords or keys)
      OPERATOR_EMAIL=you@example.com
      DAD_EMAIL=dad@example.com
      ADMIN_EMAIL=office@example.com
  - path: /opt/jbw/theme/theme.json
    permissions: '0644'
    content: |
      {
        "name": "JBW",
        "icon": "icon.png",
        "light": {
          "primary": "#1A3852",
          "primaryHover": "#24486A",
          "primaryForeground": "#FFFFFF"
        },
        "dark": {
          "primary": "#F09A3A",
          "primaryHover": "#F3AD5E",
          "primaryForeground": "#1A3852"
        }
      }
  - path: /opt/jbw/theme/icon.png
    permissions: '0644'
    encoding: b64
    content: 
  - path: /opt/jbw/setup.sh
    permissions: '0700'
    content: |
      #!/usr/bin/env bash
      # Sets up the JBW agent platform on a fresh Ubuntu 24.04 server (any provider).
      # Runs once from cloud-init as root. Log: /var/log/jbw-setup.log
      # Result: https://jbw.<server-ip-with-dashes>.sslip.io, accounts in /root/jbw-accounts.txt
      set -euo pipefail
      exec > >(tee -a /var/log/jbw-setup.log) 2>&1

      # Filled in before pasting (see settings.env in cloud-init.yaml).
      # shellcheck disable=SC1091
      source /opt/jbw/settings.env
      : "${OPERATOR_EMAIL:?}" "${DAD_EMAIL:?}" "${ADMIN_EMAIL:?}"

      FORK_RAW="https://raw.githubusercontent.com/waqarahmed1011/rakazo/claude/loving-ride-r8uxm7/infra/compose"
      APP_IMAGE="ghcr.io/waqarahmed1011/rakazo/app"
      APP_TAG="clients"

      # The address of the default route; on a VPS that is the public IPv4.
      IP=$(ip -4 route get 1.1.1.1 | awk '{for (i = 1; i < NF; i++) if ($i == "src") print $(i + 1)}')
      HOST="jbw.${IP//./-}.sslip.io"
      echo "Setting up ${HOST}"

      export DEBIAN_FRONTEND=noninteractive
      apt-get update -q
      apt-get install -y -q caddy ufw unattended-upgrades openssl
      curl -fsSL https://get.docker.com | sh

      ufw allow OpenSSH
      ufw allow 80/tcp
      ufw allow 443
      ufw --force enable

      mkdir -p /opt/jbw/rakazo
      cd /opt/jbw/rakazo
      cp -r /opt/jbw/theme ./theme
      cat > docker-compose.override.yml <<'YAML'
      services:
        web:
          volumes:
            - ./theme:/theme:ro
      YAML

      export RAKAZO_DOWNLOAD_BASE="$FORK_RAW"
      curl -fsSLO "$FORK_RAW/install-images.sh"
      bash install-images.sh --prepare-only

      # shellcheck disable=SC1091
      source /opt/jbw/lib-env.sh

      # Use the JBW fork image; fall back to upstream if the fork image hasn't been published yet.
      if docker manifest inspect "${APP_IMAGE}:${APP_TAG}" > /dev/null 2>&1; then
        set_env RAKAZO_IMAGE "$APP_IMAGE"
        set_env RAKAZO_IMAGE_TAG "$APP_TAG"
      else
        echo "WARNING: ${APP_IMAGE}:${APP_TAG} not found, using upstream image (colors only, no JBW name/icon)."
      fi
      set_env RAKAZO_HOST "$HOST"
      set_env BETTER_AUTH_URL "https://${HOST}"
      set_env WEB_ORIGIN "https://${HOST}"
      set_env API_URL "https://${HOST}"
      set_env SIGNUPS_ENABLED false
      set_env RAKAZO_THEME /theme/theme.json
      set_env INSTANCE_NAME JBW
      # Shows the hold-to-talk mic and the Call button (they need a voice provider in Settings, Voice).
      set_env PHONE_CALLS_ENABLED true
      # The ticket Board: bots propose work as offer cards and pick up approved tickets.
      set_env TICKET_BOARD_ENABLED true
      # A reply stops after 25 tool calls instead of running on (unset means unlimited).
      set_env MAX_TOOL_CALLS_PER_TURN 25
      ensure_push_keys "$OPERATOR_EMAIL"

      bash install-images.sh

      cat > /etc/caddy/Caddyfile <<CADDY
      ${HOST} {
        reverse_proxy 127.0.0.1:5173
      }
      CADDY
      systemctl reload caddy || systemctl restart caddy

      # Accounts: one per person, random first password, changed on first sign-in.
      compose=(docker compose --env-file .env -f docker-compose.images.yml -f docker-compose.override.yml)
      umask 077
      {
        echo "JBW platform: https://${HOST}"
        echo "Change each password after the first sign-in (Settings, Account)."
        echo
      } > /root/jbw-accounts.txt
      for OWNER_EMAIL in "$OPERATOR_EMAIL" "$DAD_EMAIL" "$ADMIN_EMAIL"; do
        OWNER_PASSWORD=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)
        export OWNER_EMAIL OWNER_PASSWORD
        "${compose[@]}" exec -T -e OWNER_EMAIL -e OWNER_PASSWORD api node dist/cli/bootstrap-owner.js
        echo "${OWNER_EMAIL}  ${OWNER_PASSWORD}" >> /root/jbw-accounts.txt
        unset OWNER_EMAIL OWNER_PASSWORD
      done

      echo "https://${HOST}" > /root/jbw-url.txt
      echo "DONE: https://${HOST}"
  - path: /opt/jbw/lib-env.sh
    permissions: '0644'
    content: |
      # Shared by the JBW server scripts: edit one KEY=value line in the platform's .env.
      set_env() {
        local key=$1 value=$2
        if grep -qE "^[#[:space:]]*${key}=" .env; then
          sed -i -E "s|^[#[:space:]]*${key}=.*|${key}=${value}|" .env
        else
          echo "${key}=${value}" >> .env
        fi
      }

      env_value() {
        grep -E "^${1}=" .env | tail -1 | cut -d= -f2-
      }

      # Web Push keys (P-256): the public key goes to browsers, the private key stays here.
      ensure_push_keys() {
        [[ -n "$(env_value WEB_PUSH_PRIVATE_KEY)" ]] && return 0
        local pem
        pem=$(mktemp)
        openssl ecparam -name prime256v1 -genkey -noout -out "$pem"
        local b64url='base64 -w0 | tr "+/" "-_" | tr -d "="'
        set_env WEB_PUSH_PRIVATE_KEY "$(openssl ec -in "$pem" -outform DER 2>/dev/null | tail -c +8 | head -c 32 | eval "$b64url")"
        set_env WEB_PUSH_PUBLIC_KEY "$(openssl ec -in "$pem" -pubout -outform DER 2>/dev/null | tail -c 65 | eval "$b64url")"
        set_env WEB_PUSH_CONTACT "mailto:$1"
        rm -f "$pem"
      }

      # Reinstalls from the JBW fork's compose files, which pass the JBW settings to the app.
      # Upstream's files (the installer's default) drop INSTANCE_NAME and the push keys.
      run_install() {
        export RAKAZO_DOWNLOAD_BASE="https://raw.githubusercontent.com/waqarahmed1011/rakazo/claude/loving-ride-r8uxm7/infra/compose"
        curl -fsSL "$RAKAZO_DOWNLOAD_BASE/install-images.sh" -o install-images.sh
        curl -fsSL "$RAKAZO_DOWNLOAD_BASE/docker-compose.images.yml" -o docker-compose.images.yml
        bash install-images.sh
      }
  - path: /opt/jbw/add-composio.sh
    permissions: '0700'
    content: |
      #!/usr/bin/env bash
      # Adds the Composio API key (Gmail, Calendar, Drive and Sheets connections) without it ever
      # appearing on screen or in chat. Run as root in the server console:  bash /opt/jbw/add-composio.sh
      set -euo pipefail
      cd /opt/jbw/rakazo
      # shellcheck disable=SC1091
      source /opt/jbw/lib-env.sh

      read -r -s -p "Paste the Composio API key, then press Enter: " KEY
      echo
      [[ ${#KEY} -ge 16 && "$KEY" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "That doesn't look like a Composio API key."; exit 1; }
      set_env COMPOSIO_API_KEY "$KEY"
      unset KEY

      run_install
      echo "Composio added. In the app: Settings, Integrations, Gmail, Connect."
runcmd:
  - [bash, /opt/jbw/setup.sh]
